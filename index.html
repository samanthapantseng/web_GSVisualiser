<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>VBZ Flexity — Gaussian splat scan</title>
        <meta
            name="description"
            content="A Gaussian splat scan of a VBZ Flexity tram, navigable in the browser."
        />
    </head>

    <body>
        <div id="app"></div>

        <!-- Shown while the capture downloads, then hidden. Filled in by
             src/loader.js; the caption comes from the scene entry, so no
             scene is named here. -->
        <div id="status" hidden></div>

        <!-- Frame timing and splat count. Toggle with H. -->
        <div id="hud" hidden>
            <div id="hudHead">—</div>
            <div id="hudDetail"></div>
        </div>

        <div id="hint" hidden></div>

        <!-- The caption under an open detail capture: what you are looking at,
             how far off it is from arriving, and the way out of it. Filled in
             by src/viewer.js; the circles that open it are built in
             src/hotspots.js. -->
        <div id="detail" hidden>
            <div id="detailText">
                <strong id="detailTitle"></strong>
                <span id="detailNote"></span>
            </div>
            <button id="detailClose" type="button">Close <kbd>Esc</kbd></button>
        </div>
        <!-- The same way out, where a close button is expected to be. -->
        <button id="detailX" class="close-x" type="button" aria-label="Close detail view" hidden>&times;</button>

        <div id="photo" hidden>
            <figure id="photoFigure">
                <button id="photoX" class="close-x" type="button" aria-label="Close photo">&times;</button>
                <!-- Clipping frame for the zoom: click the photo to magnify
                     it, move to look around, click again to zoom out. -->
                <div id="photoFrame">
                    <img id="photoImg" alt="" />
                </div>
                <figcaption>
                    <span id="photoText">
                        <strong id="photoTitle"></strong>
                        <span id="photoNote"></span>
                        <span id="photoZoomHint">Click the photo to zoom in</span>
                    </span>
                    <button id="photoClose" type="button">Close <kbd>Esc</kbd></button>
                </figcaption>
            </figure>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
